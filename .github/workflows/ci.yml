name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      library_ref:
        description: "Branch, Tag oder Commit von PhotonPower/Raytatouille für den Bibliothekstest"
        required: false
        default: main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Schnell, ohne die C++-Bibliothek: Lint und die reine Logik (Builder, Kataloge, Hilfsfunktionen).
  lint-and-unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -m "not library"

  # Baut Raytatouille aus dem Quellcode und lässt die ganze App mit Streamlits AppTest laufen.
  library:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PhotonPower/Raytatouille
          ref: ${{ inputs.library_ref || 'main' }}
          path: raytatouille-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Systempakete der Bibliothek
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libeigen3-dev nlohmann-json3-dev libtbb-dev
      - name: Raytatouille bauen und installieren
        run: pip install "./raytatouille-src[plot]"
      - run: pip install -e ".[dev]"
      - name: Bibliotheksversion
        run: python -c "import raytatouille as rt; print(rt.__version__, 'layout:', hasattr(rt, 'layout'))"
      - name: Tests (inklusive App-Rauchtests)
        env:
          RTT_REPO: ${{ github.workspace }}/raytatouille-src
        run: pytest
